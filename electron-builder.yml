appId: com.example.sonic-topography
productName: Sonic Topography
publish: null
asar: true
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/**/*
  - local-server.mjs
  - data/**/*
  - package.json
  # Exclude development / build artifacts / metadata
  - "!**/*.map"
  - "!dist/**/*.map"
  - "!**/.DS_Store"
  - "!**/Thumbs.db"
  - "!src/**/*"
  - "!public/**/*"
  - "!.trae/**/*"
  - "!.github/**/*"
  - "!.gitignore"
  - "!.env*"
  - "!README.md"
  - "!metadata.json"
  - "!download-demo.mjs"
  - "!start-sonic-topography.bat"
  - "!start-windows-app.bat"
  # Reduce node_modules bloat
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/test/**/*"
  - "!node_modules/**/tests/**/*"
  - "!node_modules/**/docs/**/*"
  - "!node_modules/**/examples/**/*"
  - "!node_modules/**/.github/**/*"
win:
  target:
    - nsis
    - portable
  icon: electron/assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/assets/icon.ico
  uninstallerIcon: electron/assets/icon.ico
  installerHeaderIcon: electron/assets/icon.ico
